# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m

# Disable excessive parallel compilation to avoid LLVM out of memory
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Target ARM 64-bit for physical Android phones
reactNativeArchitectures=arm64-v8a

# Support New Architecture
newArchEnabled=true

# Enable Hermes JS engine
hermesEnabled=true

# Enable edge-to-edge display support
edgeToEdgeEnabled=true

# Image configs
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false
expo.inlineModules.watchedDirectories=[]